    <title>Location</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <style>
        #userLocation {
            width: 90%;
            height: 420px;
            margin: 10px auto;
        }
    </style>
</head>
<body>
<h1>Location Finder</h1>

<div id="userLocation"></div>
<button id="locate-me">Locate Me!</button>
<br/>
<p id="status"></p>
<a id="map-link" target="_blank"></a>

<script>
    function locateMe() {
        const status = document.querySelector("#status");
        const mapLink = document.querySelector("#map-link");

        mapLink.href = "";
        mapLink.textContent = "";

        function success(position) {
            const lat = position.coords.latitude;
            const long = position.coords.longitude;

            status.textContent = "";
            mapLink.href = `https://www.openstreetmap.org/#map=18/${lat}/${long}`;
            mapLink.textContent = `You are at : ${lat} °,  ${long} °!`;
        }

        function error() {
            status.textContent = "Cannot get your location, sorry :(";
        }

        if (!navigator.geolocation) {
            status.textContent = "Invalid Browser!";
        } else {
            status.textContent = "Getting Location…";
            navigator.geolocation.getCurrentPosition(success, error);
        }
    }

    document.querySelector("#locate-me").addEventListener("click", locateMe);

    const map = L.map("userLocation");
    map.setView([0, 0], 10);

    const marker = L.marker([0, 0]).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "OpenStreetMap contributors",}).addTo(map);

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
                const mapLat = position.coords.latitude;
                const mapLong = position.coords.longitude;

                marker.setLatLng([mapLat, mapLong]);
                map.setView([mapLat, mapLong], 10);
            },
            (error) => {
                console.error(`Cannot get your location, sorry :(   : ${error.message}`);
            });
    } else {
        console.error("Invalid Browser!");
    }
</script>
</body>
